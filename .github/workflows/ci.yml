name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install system dependencies (Tesseract OCR)
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Wait for Qdrant and Redis services
      run: |
        python -c "
        import socket, time
        for port in [6333, 6379]:
            connected = False
            for _ in range(30):
                try:
                    s = socket.create_connection(('localhost', port), timeout=1)
                    s.close()
                    connected = True
                    print(f'Port {port} is open and ready.')
                    break
                except Exception:
                    time.sleep(1)
            if not connected:
                raise RuntimeError(f'Service on port {port} failed to become ready.')
        "

    - name: Run tests
      env:
        QDRANT_URL: http://localhost:6333
        REDIS_URL: redis://localhost:6379
        LLM_API_KEY: placeholder_key
        PYTHONPATH: backend:.
      run: |
        cd backend
        python -m pytest
