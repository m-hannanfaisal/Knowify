name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install system dependencies (Tesseract OCR)
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr

    - name: Install dependencies (CPU PyTorch + requirements)
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -r backend/requirements.txt

    - name: Wait for Qdrant and Redis services
      run: |
        python -c "
        import urllib.request, time, socket

        print('=== Polling Qdrant and Redis for Application Readiness ===')

        # 1. Qdrant HTTP GET readiness check (Qdrant root API endpoint)
        qdrant_ok = False
        for attempt in range(1, 31):
            try:
                req = urllib.request.Request('http://localhost:6333/')
                with urllib.request.urlopen(req, timeout=3) as resp:
                    if resp.status == 200:
                        print(f'[Attempt {attempt}/30] Qdrant HTTP / returned 200 OK.')
                        qdrant_ok = True
                        break
            except Exception as e:
                print(f'[Attempt {attempt}/30] Qdrant HTTP check waiting... ({e})')
            time.sleep(2)

        if not qdrant_ok:
            raise RuntimeError('Qdrant service failed to respond with HTTP 200 OK within 60s.')

        # 2. Redis RESP PING readiness check
        redis_ok = False
        for attempt in range(1, 31):
            try:
                s = socket.create_connection(('localhost', 6379), timeout=3)
                s.sendall(b'*1\r\n$4\r\nPING\r\n')
                reply = s.recv(1024)
                s.close()
                if b'PONG' in reply:
                    print(f'[Attempt {attempt}/30] Redis RESP PING returned +PONG.')
                    redis_ok = True
                    break
            except Exception as e:
                print(f'[Attempt {attempt}/30] Redis PING check waiting... ({e})')
            time.sleep(2)

        if not redis_ok:
            raise RuntimeError('Redis service failed to respond to PING within 60s.')
        "

    - name: Run tests
      env:
        QDRANT_URL: http://localhost:6333
        REDIS_URL: redis://localhost:6379/0
        QDRANT_MODE: docker
        CACHE_MODE: redis
        LLM_API_KEY: placeholder_key
        PYTHONPATH: backend:.
      run: |
        cd backend
        python -m pytest
