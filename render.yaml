services:
  # 1. FastAPI Web Backend Service
  - type: web
    name: knowify-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    plan: starter
    envVars:
      - key: PORT
        value: 8000
      - key: LLM_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: QDRANT_URL
        fromService:
          type: web
          name: knowify-qdrant
          property: hostport
      - key: REDIS_URL
        fromService:
          type: redis
          name: knowify-redis
          property: connectionString
      - key: QDRANT_MODE
        value: "docker"
      - key: CACHE_MODE
        value: "redis"

  # 2. Redis Private Cache Instance
  - type: redis
    name: knowify-redis
    plan: starter
    ipAllowList: []

  # 3. Qdrant Vector Database — official Docker image (no custom Dockerfile needed)
  - type: web
    name: knowify-qdrant
    env: docker
    dockerImage: qdrant/qdrant:latest
    plan: starter
    disk:
      name: qdrant-storage
      mountPath: /qdrant/storage
      sizeGB: 10
